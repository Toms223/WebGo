name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Vet and test WebGo
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./...
          go test ./...

      - name: OpenFeature goldens are generated by the real Web SDK
        working-directory: openfeature/internal/parity/js
        run: |
          npm ci
          node surface.mjs
          node gen.mjs
          git diff --exit-code ../golden

      - name: OpenFeature wasm tests
        run: |
          export PATH="$(go env GOROOT)/lib/wasm:$PATH"
          GOOS=js GOARCH=wasm go test ./openfeature/jsprovider/...
          GOOS=js GOARCH=wasm go test ./openfeature/flipt/
          GOOS=js GOARCH=wasm go test -exec "$PWD/openfeature/internal/parity/js/wasm_exec_with_fake.sh" ./openfeature/internal/parity/

      - name: Vet and test the docs against this checkout
        working-directory: docs
        run: |
          go mod edit -replace github.com/Toms223/WebGo=../
          go mod tidy
          go vet ./...
          go test ./...

  flipt-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: openfeature/flipt/e2e/go.mod

      - name: Flipt provider parity in a real browser
        working-directory: openfeature/flipt/e2e
        run: go test -tags e2e -count=1 -timeout 15m ./...
