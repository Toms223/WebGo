# Builds the WebGo documentation site and deploys it to GitHub Pages
name: Deploy docs to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      - name: Build the WebAssembly binary
        run: GOARCH=wasm GOOS=js go build -o web/app.wasm .

      # --github-pages makes every asset path resolve under /<repo>/ instead of
      # the domain root, which is where a project Pages site is served from.
      - name: Generate the static site
        run: go run . static -o dist --github-pages "${{ github.event.repository.name }}"

      # The generator does not copy web/, and the markdown is fetched from
      # /data/, so it is moved out of web/ the same way the container build does.
      - name: Assemble the artifact
        run: |
          mkdir -p dist/web
          cp -r web/. dist/web/
          mv dist/web/data dist/data
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
