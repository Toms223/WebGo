<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="WebGo roadmap to v1: keep what works, new features, extras, ship v1"><title>WebGo roadmap to v1</title><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(21,19,26,0.07)" stroke-width="2"/></pattern></defs><rect width="1200" height="450" fill="#F4F0E8"/><rect width="1200" height="450" fill="url(#g)"/><g><rect x="48" y="48" width="252" height="360" rx="16" fill="#15131A"/><rect x="40" y="40" width="252" height="360" rx="16" fill="#FFD60A" stroke="#15131A" stroke-width="3"/></g><text x="62" y="92" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#15131A" text-anchor="start">01</text><rect x="62" y="104" width="48" height="5" fill="#15131A"/><text x="62" y="150" font-family="'Bricolage Grotesque','Archivo','Arial Black',system-ui,sans-serif" font-size="26" font-weight="800" fill="#15131A" text-anchor="start">Keep what</text><text x="62" y="180" font-family="'Bricolage Grotesque','Archivo','Arial Black',system-ui,sans-serif" font-size="26" font-weight="800" fill="#15131A" text-anchor="start">works</text><text x="62" y="232" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="500" fill="#15131A" text-anchor="start">Fork go-app v11.</text><text x="62" y="266" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="500" fill="#15131A" text-anchor="start">Move page, data and</text><text x="62" y="290" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="500" fill="#15131A" text-anchor="start">style into the core.</text><text x="62" y="324" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="50