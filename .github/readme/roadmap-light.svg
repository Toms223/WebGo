="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="500" fill="#15131A" text-anchor="start">OpenFeature: pure Go,</text><text x="347" y="372" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="500" fill="#15131A" text-anchor="start">runs in the browser</text><path d="M588 220H606M599 212L607 220L599 228" fill="none" stroke="#15131A" stroke-width="3" stroke-linecap="square"/><g><rect x="618" y="48" width="252" height="360" rx="16" fill="#15131A"/><rect x="610" y="40" width="252" height="360" rx="16" fill="#C9B3FF" stroke="#15131A" stroke-width="3"/></g><text x="632" y="92" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#15131A" text-anchor="start">03</text><rect x="632" y="104" width="48" height="5" fill="#15131A"/><text x="632" y="150" font-family="'Bricolage Grotesque','Archivo','Arial Black',system-ui,sans-serif" font-size="26" font-weight="800" fill="#15131A" text-anchor="start">Extras</text><text x="632" y="232" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="500" fill="#15131A" text-anchor="start">Dev server: a small</text><text x="632" y="256" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="500" fill="#15131A" text-anchor="start">HTTP server for the</text><text x="632" y="280" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="500" fill="#15131A" text-anchor="start">built site.</text><text x="632" y="314" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="500" fill="#15131A" text-anchor="start">A folder watcher</text><text x="632" y="338" font-family="'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="